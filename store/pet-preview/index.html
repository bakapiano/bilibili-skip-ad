<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiliSkip · 小宠物交互预览</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main>
      <header><span class="brand">BiliSkip</span><span class="tag">本地交互预览</span></header>
      <h1>看视频的时候，<br />旁边多一个小伙伴。</h1>
      <p class="intro">单击小宠物，看看摸头回弹并听听音效。按住拖动可以换个位置。</p>
      <section class="demo-card">
        <h2>试试不同的状态</h2>
        <p>以下按钮使用固定模拟数据，所有金额仅用于演示，实际模型调用为 0 次。</p>
        <div class="actions">
          <button data-demo="analyze">模拟识别 → 显示费用</button>
          <button data-demo="cache">命中共享缓存 · ¥0</button>
          <button data-demo="skip">模拟自动跳过 · 49.7 秒</button>
          <button data-demo="asr">本地转写</button>
          <button data-demo="error">请求异常</button>
          <button data-demo="reset">待机 / 恢复宠物</button>
        </div>
        <output id="status">准备好了，先捏一下她吧。</output>
      </section>
      <p class="note">本页独立演示 UI。扩展和油猴预览包中的小宠物订阅真实任务状态。</p>
    </main>
    <script src="pet-state.js"></script>
    <script src="pet-assets.js"></script>
    <script src="pet.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
