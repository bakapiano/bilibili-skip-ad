# Managed by BiliSkip deployment.
server {
    listen 80;
    server_name biliskipad.bakapiano.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/biliskipad/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
