# Managed by BiliSkip deployment.
server {
    listen 80;
    server_name biliskipad.bakapiano.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/biliskipad/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://biliskipad.bakapiano.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name biliskipad.bakapiano.com;
    ssl_certificate /etc/biliskipad/tls/fullchain.pem;
    ssl_certificate_key /etc/biliskipad/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    root /srv/biliskipad/current/site;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /privacy {
        return 301 /privacy.html;
    }

    location = /privacy.html {
        try_files $uri =404;
        expires -1;
    }

    location = /site.css {
        try_files $uri =404;
        expires 1h;
    }

    location = /stats.js {
        types { application/javascript js; }
        try_files $uri =404;
        expires 1h;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location = /downloads/biliskip.zip {
        types { application/zip zip; }
        try_files $uri =404;
        expires -1;
    }

    location = /downloads/biliskip.zip.sha256 {
        types { text/plain sha256; }
        try_files $uri =404;
        expires -1;
    }

    location /downloads/ {
        types {
            application/zip zip;
            text/plain sha256;
        }
        try_files $uri =404;
        expires 1h;
    }

    location = /v1/transcripts {
        client_max_body_size 512k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location /v1/ {
        client_max_body_size 64k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Pinned, public model data is served directly from persistent storage.
    location = /models/sensevoice-small-int8/c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51.onnx {
        alias /srv/biliskipad/models/sensevoice-small-int8/c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51.onnx;
        default_type application/octet-stream;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location = /models/sensevoice-small-int8/LICENSE {
        alias /srv/biliskipad/models/sensevoice-small-int8/LICENSE;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /models/sensevoice-small-int8/NOTICE.md {
        alias /srv/biliskipad/models/sensevoice-small-int8/NOTICE.md;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Immutable userscript @resource binaries, pinned by content hash and SRI.
    location ^~ /asr/sherpa-onnx-1.12.20/ {
        alias /srv/biliskipad/asr/sherpa-onnx-1.12.20/;
        autoindex off;
        disable_symlinks on;
        types { application/wasm wasm; application/octet-stream bin; text/plain md txt; }
        default_type text/plain;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location / {
        return 404;
    }
}
