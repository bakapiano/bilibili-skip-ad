# Managed by BiliSkip deployment.
server {
    listen 80;
    server_name biliskipad.bakapiano.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/biliskipad/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://biliskipad.bakapiano.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name biliskipad.bakapiano.com;
    ssl_certificate /etc/biliskipad/tls/fullchain.pem;
    ssl_certificate_key /etc/biliskipad/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    root /srv/biliskipad/current/site;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /privacy {
        return 301 /privacy.html;
    }

    location = /privacy.html {
        try_files $uri =404;
        expires -1;
    }

    location = /site.css {
        try_files $uri =404;
        expires 1h;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location /downloads/ {
        types {
            application/zip zip;
            text/plain sha256;
        }
        try_files $uri =404;
        expires 1h;
    }

    location /v1/ {
        client_max_body_size 64k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
