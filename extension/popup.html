<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiliSkip</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main aria-label="BiliSkip 广告跳过">
      <header>
        <img class="brand-icon" src="icons/icon.svg" alt="" width="36" height="36" />
        <h1>BiliSkip</h1>
        <span id="source">本地优先</span>
        <button id="options" type="button">设置</button>
      </header>
      <p id="video-title">当前视频</p>
      <p id="status" role="status" aria-live="polite">正在连接视频页…</p>
      <div class="actions">
        <button id="analyze" class="primary" type="button" disabled>分析当前视频</button>
        <button id="refresh" type="button" disabled>读取缓存</button>
        <button id="online" type="button" disabled>读取线上缓存</button>

        <button id="skip" type="button" disabled>跳过当前广告</button>
        <button id="undo" type="button" disabled>撤销跳过</button>
      </div>
      <button
        id="toggle"
        class="skip-switch"
        role="switch"
        aria-checked="false"
        type="button"
        disabled
      >
        自动跳过广告
      </button>
      <div id="meter" aria-label="广告时间轴"></div>
      <details open>
        <summary id="summary">广告标记</summary>
        <div id="segments"></div>
      </details>
      <p id="meta" class="hint"></p>
      <button id="upload" type="button" hidden>上传到线上缓存</button>
      <p id="upload-status" class="hint"></p>
      <footer>金色区间为符合跳过条件的广告。关闭面板后继续处理。</footer>
    </main>
    <script src="player-core.js"></script>
    <script src="popup-view.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
